# Each component lists which other components it depends on (pulls in
# recursively). Stimulus controllers are co-located: the component
# generator copies every file inside `lib/shadcnrb/<name>/` — so a sibling
# `<name>_controller.js` (or `toast_trigger_controller.js` etc.) comes
# along automatically. No `stimulus:` key needed.

icon:
  components: []

avatar:
  components: []

card:
  components: []

input:
  components: []

label:
  components: []

separator:
  components: []

skeleton:
  components: []

switch:
  components: []

badge:
  components: []

button:
  components: []

# Modal overlays: `anchored` supplies the trigger-slot mechanics (not
# positioning — the panels are centered/edge-anchored by CSS).
dialog:
  components:
    - anchored
    - button

drawer:
  components:
    - anchored
    - button

sidebar:
  components:
    - link

toast:
  components:
    - icon

alert:
  components:
    - icon

breadcrumb:
  components:
    - link

button_group:
  components: []

dropdown_menu:
  components:
    - anchored
    - button
    - link

progress:
  components: []

tabs:
  components: []

typography:
  components: []

empty:
  components:
    - icon

link:
  components:
    - button
    - icon

theme_switcher:
  components:
    - dropdown_menu

# Opt-in: only needed if you pass `builder: Shadcnrb::FormBuilder` to
# `form_with`. It's a class (not a module), so it's not mixed into the sui
# Builder — `skip_wire` tells the generator to skip that step.
form_builder:
  components:
    - label
    - input
    - textarea
    - checkbox
    - radio_group
    - select
    - form_field
    - button
  skip_wire: true

navigation_menu:
  components:
    - anchored
    - link

collapsible:
  components: []

# Shared trigger-slot plumbing + positioning controller for anchored
# overlays. Not a renderable component — nothing to mix into the Builder.
# Placement math comes from @floating-ui/dom, vendored into the host app
# via `bin/importmap pin` (resolves its transitive pins too).
anchored:
  components: []
  skip_wire: true
  pins:
    - "@floating-ui/dom@1.6.12"

# Both overlays render the trigger from a caller-supplied block, so beyond
# the shared anchored plumbing they depend on nothing.
tooltip:
  components:
    - anchored

hover_card:
  components:
    - anchored
